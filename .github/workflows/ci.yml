name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: Stitching engine tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: swift test (release, includes synthetic full-sphere stitch)
        working-directory: Packages/PanoramaCore
        run: swift test -c release -Xswiftc -enable-testing

  build-app:
    name: Build iOS app (unsigned)
    runs-on: xcode-27
    env:
      BUNDLE_ID: ${{ vars.BUNDLE_ID || secrets.BUNDLE_ID || 'com.example.pano360' }}
      DEVELOPMENT_TEAM: ""
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build
        run: |
          mkdir -p build
          xcodebuild build \
            -project Pano360.xcodeproj -scheme Pano360 -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            > build/xcodebuild.log 2>&1 || true
          grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" build/xcodebuild.log | sort -u | head -200 || true
          grep -q "BUILD SUCCEEDED" build/xcodebuild.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: build/xcodebuild.log
